<!doctype html>
<html><head><meta charset="utf-8"><title>studio3d</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="uit" width="1080" height="1920"></canvas>
<script type="module">

import * as THREE from 'three';

doos(10, 4, 0.1, 0xf3e6cf, 0, 2, -4);                           // achterwand

doos(1.4, 0.95, 0.07, 0xbfe3f5, -0.2, 2.05, -3.9);              // raam
doos(0.08, 2.4, 1.2, 0x8a5a3a, -3.94, 1.2, 1.6);                // deurpost linkerwand
doos(0.05, 2.3, 1.05, 0xf8f1e4, -3.97, 1.15, 1.6);              // deuropening (licht)
doos(1.4, 0.06, 0.9, 0xb5784a, -1.3, 0.78, -1.2);               // tafel
for (const [x, z] of [[-1.9, -1.55], [-0.7, -1.55], [-1.9, -0.85], [-0.7, -0.85]]) doos(0.06, 0.76, 0.06, 0x8a5a3a, x, 0.38, z);
const mok = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.14, 20), M(0xffffff)); mok.position.set(1.5, 1.15, -3.45); scene.add(mok);
// wandklok op 7:15
const klok = new THREE.Group(); klok.position.set(-2.4, 2.75, -3.92); scene.add(klok);
const rand = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.08, 48), M(0xd8392f)); rand.rotation.x = Math.PI / 2; klok.add(rand);
const wijzerplaat = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.09, 48), M(0xffffff)); wijzerplaat.rotation.x = Math.PI / 2; klok.add(wijzerplaat);
for (let i = 0; i < 12; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.07, 0.01), M(0x333333)); const a = i / 12 * Math.PI * 2; s.position.set(Math.sin(a) * 0.3, Math.cos(a) * 0.3, 0.05); s.rotation.z = -a; klok.add(s); }
const wijzer = (lang, dik, hoek, kleur) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(dik, lang, 0.012), M(kleur)); m.position.y = lang / 2; g.add(m); g.position.z = 0.06; g.rotation.z = -hoek; klok.add(g); return g; };
wijzer(0.19, 0.035, (7 + 15 / 60) / 12 * Math.PI * 2, 0x222222); const minuut = wijzer(0.28, 0.025, 15 / 60 * Math.PI * 2, 0x222222);
const sec = wijzer(0.3, 0.008, 0, 0xd8392f);
// ---- personages (zelfde kleuren als de 2D-poppetjes) ----
const HUID = 0xffdec4, LIJN = 0x2d2628;
function persoon(k) {
  const g = new THREE.Group(); scene.add(g); const s = k.groot || 1; g.scale.setScalar(s);
  const benen = [-1, 1].map(z => { const p = new THREE.Group(); p.position.set(z * 0.13, 0.78, 0); g.add(p);
    const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.55, 6, 12), M(k.broek)); b.position.y = -0.38; b.castShadow = true; p.add(b);
    const sch = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), M(0x3a3236)); sch.scale.set(1, 0.6, 1.4); sch.position.set(0, -0.72, 0.05); p.add(sch); return p; });
  const lijf = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.45, 8, 20), M(k.shirt)); lijf.position.y = 1.2; lijf.castShadow = true; g.add(lijf);
  const armen = [-1, 1].map(z => { const p = new THREE.Group(); p.position.set(z * 0.36, 1.48, 0); g.add(p);
    const a = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.45, 6, 12), M(k.shirt)); a.position.y = -0.27; a.castShadow = true; p.add(a);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), M(HUID)); h.position.y = -0.56; p.add(h); return p; });
  const hoofd = new THREE.Group(); hoofd.position.y = 2.05; g.add(hoofd);
  const kop = new THREE.Mesh(new THREE.SphereGeometry(0.46, 40, 30), M(HUID)); kop.castShadow = true; hoofd.add(kop);
  const haar = new THREE.Mesh(new THREE.SphereGeometry(0.48, 40, 30, 0, Math.PI * 2, 0, Math.PI * 0.42), M(k.haar)); haar.rotation.x = -0.25; hoofd.add(haar);
  const ogen = [-1, 1].map(z => { const o = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), new THREE.MeshBasicMaterial({ color: LIJN })); o.position.set(z * 0.16, 0.02, 0.43); hoofd.add(o);
    const gl = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); gl.position.set(z * 0.16 + 0.015, 0.04, 0.48); hoofd.add(gl); return [o, gl]; });
  for (const z of [-1, 1]) { const w = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffaaa0 })); w.scale.set(1, 0.5, 0.3); w.position.set(z * 0.25, -0.1, 0.4); hoofd.add(w); }
  const mond = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 12), new THREE.MeshBasicMaterial({ color: 0x78283a })); mond.scale.set(1, 0.18, 0.4); mond.position.set(0, -0.2, 0.43); hoofd.add(mond);
  if (k.bril) for (const z of [-1, 1]) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.014, 8, 30), new THREE.MeshBasicMaterial({ color: LIJN })); r.position.set(z * 0.16, 0.02, 0.47); hoofd.add(r); }
  return { g, benen, armen, hoofd, ogen, mond };
}
const jij = persoon({ broek: 0x373c55, shirt: 0x4682dc, haar: 0x3c2d28, groot: 0.92 });
const papa = persoon({ broek: 0x5a5046, shirt: 0x5ab46e, haar: 0x78502f, bril: true, groot: 1.12 });
const ease = x => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2;
const kw = (w, n = 1) => { let k = 0; for (const x of D.WO) if (x[1].toLowerCase().replace(/[^\w$]/g, '').startsWith(w) && ++k === n) return x[2]; return 0; };
const T_IN0 = kw('walk') - 0.4, T_IN1 = kw('kitchen') + 0.9, T_DAD = kw('dads'), T_LAB = kw('glowing'), T_TEL = kw('$64'), T_PRAAT = D.Z[3][0];
function pose(p, t, { loop = null, zwaai = false, mond = 0, verbaasd = false, knip = false }) {
  const z = loop === null ? 0 : Math.sin(loop * Math.PI) * 0.5;
  p.benen[0].rotation.x = z; p.benen[1].rotation.x = -z;
  p.armen[0].rotation.x = -z * 0.8; p.armen[1].rotation.x = z * 0.8; p.armen[0].rotation.z = -0.12; p.armen[1].rotation.z = 0.12;
  p.g.position.y = loop === null ? Math.sin(t * 2.2) * 0.008 : Math.abs(Math.sin(loop * Math.PI)) * 0.05;
  if (zwaai) { p.armen[1].rotation.z = 2.5 + Math.sin(t * 11) * 0.35; p.armen[1].rotation.x = 0; }
  const oog = verbaasd ? 1.45 : 1; for (const [o, gl] of p.ogen) { o.scale.set(oog, knip ? 0.12 : oog, oog); gl.visible = !knip; }
  p.mond.scale.set(verbaasd && mond < 0.1 ? 0.7 : 1, 0.18 + mond * 0.9 + (verbaasd && mond < 0.1 ? 0.5 : 0), 0.4);
}
// glimmend getal boven papa
const lab = document.createElement('canvas'); lab.width = 640; lab.height = 200; const lctx = lab.getContext('2d');
const labTex = new THREE.CanvasTexture(lab); const labSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: labTex, transparent: true, depthTest: false }));
labSpr.scale.set(1.6, 0.5, 1); scene.add(labSpr);
function tekenLabel(s, a) {
  lctx.clearRect(0, 0, 640, 200); lctx.globalAlpha = a; lctx.shadowColor = '#3ce678'; lctx.shadowBlur = 30;
  lctx.fillStyle = '#0f1914'; lctx.strokeStyle = '#3ce678'; lctx.lineWidth = 10; lctx.beginPath(); lctx.roundRect(30, 30, 580, 140, 40); lctx.fill(); lctx.stroke();
  lctx.shadowBlur = 0; lctx.fillStyle = '#3ce678'; lctx.font = '900 96px "Segoe UI Black", sans-serif'; lctx.textAlign = 'center'; lctx.textBaseline = 'middle'; lctx.fillText(s, 320, 104);
  labTex.needsUpdate = true;
}
// camera-reis: [tijd, positie, kijkpunt]
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const REIS = [
  [0, V(-2.4, 2.7, -2.5), V(-2.4, 2.72, -4)],                    // dicht op de klok
  [1.7, V(-2.2, 2.6, -2.2), V(-2.4, 2.7, -4)],
  [T_IN0 + 0.6, V(-1.0, 1.9, 3.6), V(-2.6, 1.2, 1.0)],          // omlaag/achteruit: deur, jij komt binnen
  [T_IN1, V(0.3, 1.9, 3.4), V(-0.8, 1.3, -0.6)],
  [T_DAD + 0.3, V(0.9, 2.3, 0.2), V(1.6, 2.4, -2.9)],            // naar papa en het getal
  [T_TEL + 0.9, V(1.1, 2.35, -0.6), V(1.5, 2.6, -2.9)],
  [T_PRAAT + 0.2, V(-0.1, 1.9, 2.4), V(0.4, 1.6, -1.6)],        // uitzoomen: jullie allebei
  [D.EIND, V(-0.2, 1.85, 2.9), V(0.3, 1.5, -1.5)]];
function camera(t) {
  let i = 0; while (i < REIS.length - 2 && t > REIS[i + 1][0]) i++;
  const [t0, p0, k0] = REIS[i], [t1, p1, k1] = REIS[i + 1]; const f = ease((t - t0) / Math.max(0.01, t1 - t0));
  cam.position.lerpVectors(p0, p1, f); cam.lookAt(new THREE.Vector3().lerpVectors(k0, k1, f));
}
// ondertitels: 1-2 woorden groot in het midden
const groepen = []; for (let i = 0; i < D.WO.length;) { const g = [D.WO[i]]; if (!/[.,!?]$/.test(D.WO[i][1]) && i + 1 < D.WO.length && D.WO[i][1].length + D.WO[i + 1][1].length < 14) g.push(D.WO[i + 1]); groepen.push(g); i += g.length; }
const uit = document.getElementById('uit'), ctx = uit.getContext('2d');
window.render = (t) => {
  // papa: eerst met zijn rug naar ons bij het aanrecht (koffie), draait om als jij binnen bent
  const draai = ease((t - (T_DAD - 0.2)) / 0.9);
  papa.g.position.x = 1.55; papa.g.position.z = -2.75; papa.g.rotation.y = Math.PI * (1 - draai) + (-0.45) * draai;
  pose(papa, t, { zwaai: t > T_PRAAT && t < T_PRAAT + 1.5, mond: D.mond[Math.floor(t * D.FPS)] || 0, knip: (t % 3.3) < 0.13 });
  const f = ease((t - T_IN0) / (T_IN1 - T_IN0));
  jij.g.position.set(-3.7 + (2.6) * f, 0, 1.6 - 1.4 * f); jij.g.rotation.y = t < T_IN1 ? Math.PI / 2 - 0.5 : 0.55 + Math.sin(t) * 0.05;
  if (t < T_IN0) jij.g.position.x = -5;                         // nog buiten de deur
  pose(jij, t, { loop: (t > T_IN0 && t < T_IN1) ? (t - T_IN0) * 2.2 : null, verbaasd: t > T_LAB + 0.3, knip: (t % 3.7) < 0.13 && t < T_LAB });
  sec.rotation.z = -t * Math.PI * 2 / 60 * 6;
  labSpr.visible = t >= T_LAB; labSpr.position.set(1.55, 3.45, -2.75);
  if (t >= T_LAB) { const v = t < T_TEL ? '$???' : '$' + Math.round(64000 * Math.min(1, (t - T_TEL) / 0.8) / 100) * 100; tekenLabel(v.replace(/\B(?=(\d{3})+(?!\d))/g, ','), Math.min(1, (t - T_LAB) / 0.3)); }
  camera(t); effect.render(scene, cam);
  ctx.drawImage(renderer.domElement, 0, 0);
  const g = groepen.find((g, k) => t >= g[0][2] - 0.05 && t < (k + 1 < groepen.length ? groepen[k + 1][0][2] : D.EIND));
  if (g) { const s = g.map(w => w[1]).join(' ').replace(/[.,?]/g, ''); ctx.font = '900 104px "Segoe UI Black"'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = 20; ctx.strokeStyle = '#000'; ctx.strokeText(s, W / 2, 1300); ctx.fillStyle = '#fff'; ctx.fillText(s, W / 2, 1300); }
  return uit.toDataURL('image/jpeg', 0.92);
};
window.klaar = true;
