<canvas id="uit" width="1080" height="1920"></canvas>

pijl.position.set(0.15, 30, 0.1); let pijlLijf = null;
// -4.6% stuitert voor de stapel
const proc = tekst3d('-4.6%', 0.7, ROOD);

mesh(new THREE.CylinderGeometry(1.0, 1.25, 0.3, 40), 0x7a5232, weeg).position.y = 0.15;
mesh(new THREE.CylinderGeometry(0.12, 0.16, 3.4, 20), 0x8a5a3a, weeg).position.y = 1.95;

  for (const a of [0, 2.1, 4.2]) { const d = mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.5, 6), 0x555555, hang); d.position.set(Math.cos(a) * 0.45, -0.72, Math.sin(a) * 0.45); d.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35); }

for (const [x, y, z] of [[-0.25, 0.25, -0.2], [0.25, 0.25, 0.2], [0, 0.59, 0]]) { const m = mesh(BAR, GOUD, links.bak); m.position.set(x * 0.8, y * 0.8 + 0.02, z * 0.8); m.scale.setScalar(0.8); m.rotation.y = 0.15; }
// obligatie: papier met blauwe band en "BOND 5%"
const pap = document.createElement('canvas'); pap.width = 512; pap.height = 360; const pc = pap.getContext('2d');
pc.fillStyle = '#fffdf6'; pc.fillRect(0, 0, 512, 360); pc.fillStyle = '#1b4fa0'; pc.fillRect(0, 0, 512, 70); pc.strokeStyle = '#1b4fa0'; pc.lineWidth = 12; pc.strokeRect(6, 6, 500, 348);
pc.fillStyle = '#fff'; pc.font = '900 48px "Segoe UI Black", sans-serif'; pc.textAlign = 'center'; pc.fillText('GOVERNMENT', 256, 54);
pc.fillStyle = '#1b4fa0'; pc.font = '900 120px "Segoe UI Black", sans-serif'; pc.fillText('BOND', 256, 210); pc.fillStyle = '#2e9654'; pc.font = '900 86px "Segoe UI Black", sans-serif'; pc.fillText('5%', 256, 315);
const papTex = new THREE.CanvasTexture(pap); papTex.colorSpace = THREE.SRGBColorSpace;
const bond = new THREE.Group(); scene.add(bond);
const bondM = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.88, 0.05), [M(0xfffdf6), M(0xfffdf6), M(0xfffdf6), M(0xfffdf6), new THREE.MeshBasicMaterial({ map: papTex }), M(0xfffdf6)]);
bondM.castShadow = true; bond.add(bondM);
// labels boven de schalen
function label(s, kleur) { const c = document.createElement('canvas'); c.width = 400; c.height = 220; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.strokeStyle = kleur; x.lineWidth = 14; x.beginPath(); x.roundRect(14, 14, 372, 192, 50); x.fill(); x.stroke();
  x.fillStyle = kleur; x.font = '900 140px "Segoe UI Black", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s, 200, 118);

const lab0 = label('0%', '#d6202a'), lab5 = label('5%', '#2e9654');
// slotvraag
const vraag = tekst3d('STILL SAFE?', 0.52, GOUD);
// ---- camera-reis: [tijd, positie, kijkpunt] ----
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const REIS = [
  [0, V(3.2, 1.0, 8.2), V(0, 1.5, 0)],                          // laag, heldhaftig naar het goud
  [T_VAL - 0.5, V(-1.6, 1.8, 8.0), V(0, 1.6, 0)],               // langzaam om de stapel heen
  [T_VAL + 0.3, V(-0.8, 2.6, 9.6), V(0, 1.2, 0.4)],             // terug: de klap
  [T_RENTE - 0.2, V(0.6, 2.8, 10.2), V(0.3, 0.9, 0.6)],
  [T_RENTE + 1.3, V(WX - 0.6, 2.4, 9.0), V(WX, 2.2, -0.4)],     // naar de weegschaal
  [T_SLOT - 0.2, V(WX + 0.4, 2.3, 8.6), V(WX, 2.2, -0.4)],
  [T_SLOT + 1.6, V(WX - 0.9, 3.6, 12.5), V(WX - 0.6, 2.9, 0)],   // terug: weegschaal + vraag

function camera(t) {
  let i = 0; while (i < REIS.length - 2 && t > REIS[i + 1][0]) i++;
  const [t0, p0, k0] = REIS[i], [t1, p1, k1] = REIS[i + 1]; const f = ease((t - t0) / Math.max(0.01, t1 - t0));
  cam.position.lerpVectors(p0, p1, f); const kijk = new THREE.Vector3().lerpVectors(k0, k1, f);
  const s = Math.max(0, 1 - (t - T_VAL) / 0.7); if (t > T_VAL && s > 0) { cam.position.x += Math.sin(t * 61) * 0.12 * s; cam.position.y += Math.sin(t * 47 + 1) * 0.1 * s; }

// ---- ondertitels: 1-2 woorden groot (zoals studio3d) ----
const groepen = []; for (let i = 0; i < D.WO.length;) { const g = [D.WO[i]]; if (!/[.,!?]$/.test(D.WO[i][1]) && i + 1 < D.WO.length && D.WO[i + 1][0] === D.WO[i][0] && D.WO[i][1].length + D.WO[i + 1][1].length < 14) g.push(D.WO[i + 1]); groepen.push(g); i += g.length; }
const uit = document.getElementById('uit'), ctx = uit.getContext('2d');
let simT = null;
function natuur(t) {

    simT = start; pijl.position.set(0.15, 6.0, 0.1); pijlLijf = body(pijl, 10, 0.3, 1.0, 0.3); pijlLijf.setLinearVelocity(new A.btVector3(0, -14, 0));

    for (const [m, b] of lijf) if (b !== pijlLijf) { const d = new THREE.Vector3(m.position.x - 0.15, 0, m.position.z + 0.3).normalize();
      const k = 5 + m.position.y * 4; b.applyCentralImpulse(new A.btVector3(d.x * k, 3 + m.position.y * 2.5, d.z * k)); b.setAngularVelocity(new A.btVector3(d.z * 6, 2, -d.x * 6)); } }

}
window.render = (t) => {
  natuur(t);
  // glinsters
  glinster.forEach((s, i) => { const f = ((t * 0.9 + i * 0.37) % 1.6) / 0.5; s.visible = t < T_VAL && f < 1; const st = staven[(i * 7) % staven.length];
    s.position.set(st.position.x + 0.3 * Math.sin(i * 3), st.position.y + 0.2, st.position.z + 0.26); s.scale.setScalar(Math.sin(Math.PI * Math.min(1, f)) * 1.2); s.scale.x *= 0.35; s.scale.z *= 0.35; s.rotation.y = t * 2; });

  else { const d = t - T_VAL; safe.position.set(safeStart.x - d * 1.6, Math.max(0.12, safeStart.y + d * 2.2 - 6 * d * d), safeStart.z - d * 2.0);
    safe.rotation.set(-Math.min(Math.PI / 2, d * 4), 0, Math.min(1.2, d * 3)); safe.material.color.lerpColors(new THREE.Color(GROEN), new THREE.Color(0x8a8a8a), Math.min(1, d * 2)); }

  lab5.visible = t > T_VIJF - 0.05; lab5.position.set(doel.x, doel.y + 1.25, doel.z + 0.4); lab5.scale.set(1.25, 0.69, 1).multiplyScalar(Math.max(0.001, pop((t - T_VIJF + 0.05) / 0.4)));

  if (g) { const s = g.map(w => w[1]).join(' ').replace(/[,?.]/g, '').toUpperCase(); ctx.font = '900 104px "Segoe UI Black"'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = 20; ctx.strokeStyle = '#000'; ctx.strokeText(s, W / 2, 1640); ctx.fillStyle = '#fff'; ctx.fillText(s, W / 2, 1640); }
  return uit.toDataURL('image/jpeg', 0.92);
};
window.klaar = true;
