const GETAL = { 0: 'zero', 1: 'one', 2: 'two', 3: 'three', 4: 'four', 5: 'five', 6: 'six', 7: 'seven', 8: 'eight', 9: 'nine' };
const VTL = [];
for (const [, w, t0, t1] of D.woorden) { let s_ = w.toLowerCase().replace(/[0-9]/g, c => GETAL[c]).replace(/[^a-z]/g, ''), ks = [];
  for (let i = 0; i < s_.length;) { const r = KL.find(([l]) => s_.startsWith(l, i)); if (r) { if (ks[ks.length - 1] !== r[1]) ks.push(r[1]); i += r[0].length; } else i++; }
  if (!ks.length) ks = ['E']; const gw = ks.map(k => 'AEOU'.includes(k) ? 2 : 1), tot = gw.reduce((a, b) => a + b); let tt_ = t0;
  ks.forEach((k, i) => { const d = (t1 - t0) * gw[i] / tot; VTL.push([tt_, tt_ + d, k]); tt_ += d; }); }
const viseem = (t) => { const v = VTL.find(([a, b]) => a - 0.03 <= t && t <= b + 0.03); return v ? v[2] : null; };
const woord = (zin, w) => (D.woorden.find(x => x[0] === zin && x[1].toLowerCase().replace(/[^a-z]/g, '').startsWith(w)) || [0, '', D.zinnen[zin][0]])[2];
const T_SNEE = woord(3, 'cut'), T_OPEN = woord(3, 'look'), T_LUCHT = woord(4, 'transistor');

// ---- 3. render op 270x480 + ondertitel en label in pixels ----
const doek = document.createElement('canvas'); doek.width = RW; doek.height = RH; const g2 = doek.getContext('2d'); g2.imageSmoothingEnabled = true;
document.body.appendChild(doek);
function ondertitel(t) {
  const zi = D.zinnen.findIndex(z => z[0] - 0.05 <= t && t <= z[1] + 0.25); if (zi < 0) return;
  const ww = D.woorden.filter(w => w[0] === zi); const stukken = []; let cur = [];
  for (const w of ww) { cur.push(w); if (cur.length >= 3 || /[.?!,]$/.test(w[1])) { stukken.push(cur); cur = []; } } if (cur.length) stukken.push(cur);
  const st = stukken.find(s => t <= s[s.length - 1][3] + 0.1) || stukken[stukken.length - 1];
  g2.font = '900 64px Arial'; g2.textBaseline = 'top'; const br = st.reduce((a, w) => a + g2.measureText(w[1].toUpperCase() + ' ').width, 0); let x = (RW - br) / 2;
  for (const w of st) { const s = w[1].toUpperCase(); g2.lineWidth = 12; g2.strokeStyle = '#000'; g2.strokeText(s, x, 1560); g2.fillStyle = (w[2] <= t && t <= w[3] + 0.05) ? '#ffd640' : '#fff'; g2.fillText(s, x, 1560); x += g2.measureText(s + ' ').width; }
}
function label(t) {
  if (t < T_LUCHT - 0.1) return;
  const p = new THREE.Vector3(0.75, 0.96, 0.3).project(camera); const px = (p.x + 1) / 2 * RW, py = (1 - p.y) / 2 * RH;
  const lx = Math.min(RW - 700, Math.max(20, px - 340)), ly = py + 300;          // label ónder de chip (niet over het gezicht)
  g2.strokeStyle = '#fff'; g2.lineWidth = 5; g2.beginPath(); g2.moveTo(px, py); g2.lineTo(lx + 340, ly); g2.stroke();
  g2.fillStyle = '#fff'; g2.fillRect(lx - 12, ly, 700, 136); g2.strokeStyle = '#000'; g2.lineWidth = 8; g2.strokeRect(lx - 12, ly, 700, 136);
  g2.fillStyle = '#1f9a5a'; g2.font = '900 54px Arial'; g2.textBaseline = 'top'; g2.fillText('208 BILLION', lx + 150, ly + 10); g2.fillText('TRANSISTORS', lx + 130, ly + 70);
}
window.render = (t) => {
  const k = zetPose(t);
  mes.visible = k >= 2 && k <= 3;
  const f = (D.mond[Math.floor(t * D.FPS)] || 0); const vs = f > 0.05 ? viseem(t) : null;
  const VORM = { A: [1.0, 3.2], E: [1.3, 1.6], O: [0.7, 2.6], U: [0.5, 1.8], M: [1.0, 0.5], F: [1.1, 0.8], L: [0.9, 2.0] };
  const [vx, vy] = vs ? VORM[vs] : [0.9, 0.7]; mond.scale.set(vx, vy, 1);
  for (const k2 of [-1, 1]) { const pu = gezicht.getObjectByName('pupil' + k2); pu.scale.y = (t % 3.3) < 0.12 ? 0.2 : 1; }
  const open = ease((t - T_OPEN) / 0.5); helftL.position.x = -0.42 * open; helftR.position.x = 0.42 * open; helftL.rotation.y = 0.7 * open; helftR.rotation.y = -0.7 * open; binnen.visible = open > 0.3;
  eendG.updateMatrixWorld(true); vlakL.copy(basisL).applyMatrix4(helftL.matrixWorld); vlakR.copy(basisR).applyMatrix4(helftR.matrixWorld);
  if (k >= 3 && k <= 4) { camera.position.set(0.25, 1.25, 5.2); camera.lookAt(0.22, 0.95, 0.2); } else { camera.position.set(0.3 + Math.sin(t * 0.4) * 0.05, 1.35, 6.2); camera.lookAt(0.3, 1.0, 0); }
  renderer.render(scene, camera);
  g2.clearRect(0, 0, RW, RH); g2.drawImage(renderer.domElement, 0, 0); ondertitel(t); label(t);
  return doek.toDataURL('image/png');
};
window.klaar = true;
