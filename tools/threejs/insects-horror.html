document.getElementById('voice').onchange = e => { const f = e.target.files?.[0]; if (f) attachAudio(URL.createObjectURL(f)); };
if (params.get('audio')) attachAudio(params.get('audio'));
let hideTimer = 0, forceHidden = params.get('clean') === '1';
function poke() {
  clearTimeout(hideTimer); hud.classList.toggle('hide', forceHidden);
  if (playing && !forceHidden) hideTimer = setTimeout(() => hud.classList.add('hide'), 2500);
}
stage.addEventListener('pointermove', poke); stage.addEventListener('pointerdown', poke);
stage.addEventListener('pointerdown', e => { if (forceHidden && !sfx.on) toggleSound(); });
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') { forceHidden = !forceHidden; poke(); }
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); playBtn.click(); }
});
poke();

function draw(T) { placeCamera(storyAt(T)); update(storyAt(T)); overlays(T); composer ? composer.render() : renderer.render(scene, camera); }
function frame(now) {
  const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    if (audio && !audio.paused && audio.readyState >= 2) T = Math.min(DURATION, audio.currentTime); else T += dt;
    if (T >= DURATION) { T = DURATION; setPlaying(false); }
  }
  placeCamera(storyAt(T)); update(storyAt(T)); sfx.update(T); overlays(T);
  scrub.value = T; timeEl.textContent = fmtTime(T);
  composer ? composer.render() : renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
const RENDER = params.get('render') === '1';
if (RENDER) {
  forceHidden = true; poke(); playing = false;
  document.body.classList.add('render');
  window.renderAt = t => { T = t; draw(T); };
  window.renderSoundtrack = renderSoundtrack;
  window.renderReady = true;
} else requestAnimationFrame(frame);
addEventListener('pagehide', () => {
  audio?.pause();
  scene.traverse(o => { o.geometry?.dispose(); [].concat(o.material ?? []).forEach(m => m.dispose()); });
  composer?.dispose?.(); pmrem.dispose(); renderer.dispose();
});
</script>
