<style>

  :root {

  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--letterbox); overflow: hidden; display: grid; place-items: center; font-family: var(--ui); }
  #stage { position: relative; background: var(--sky); container-type: inline-size; overflow: hidden; touch-action: manipulation; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, transparent 58%, rgba(0, 0, 0, 0.5) 100%); }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .title {
    position: absolute; left: 10cqw; right: 10cqw; top: 13%;
    text-align: center; pointer-events: none; color: var(--ink);
    font: 900 5cqw/1.04 var(--ui); letter-spacing: -0.015em; text-transform: uppercase; text-wrap: balance;
    -webkit-text-stroke: 0.6cqw var(--outline); paint-order: stroke fill;
    opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease; transform: translateY(1cqw);
  }
  .title small { display: block; margin-bottom: 1cqw; font: 800 1.8cqw/1 var(--mono); letter-spacing: 0.3em; color: var(--cold); -webkit-text-stroke: 0.4cqw var(--outline); }
  .title.on { opacity: 1; transform: none; }

  .chapter {
    position: absolute; left: 3cqw; top: calc(2.6cqw + env(safe-area-inset-top, 0px));
    pointer-events: none; color: var(--ink);
    opacity: 0; transform: translateX(-1.5cqw); transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .chapter.on { opacity: 1; transform: none; }
  .chapter b { display: block; font: 900 3.2cqw/1 var(--ui); letter-spacing: -0.01em; text-transform: uppercase; -webkit-text-stroke: 0.45cqw var(--outline); paint-order: stroke fill; }
  .chapter span { display: inline-block; margin-top: 0.7cqw; padding: 0.45cqw 1.1cqw; border-radius: 0.5cqw; background: rgba(6, 8, 12, 0.62); font: 800 1.3cqw/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--cold); }

  .subs {
    position: absolute; left: 12cqw; right: 12cqw; bottom: 7.5%;
    text-align: center; pointer-events: none;
    font: 900 2.9cqw/1.2 var(--ui); color: var(--ink); letter-spacing: -0.005em; text-wrap: balance;
    -webkit-text-stroke: 0.45cqw var(--outline); paint-order: stroke fill;
    text-shadow: 0 0.35cqw 1.1cqw rgba(0, 0, 0, 0.6);
    opacity: 0; transform: translateY(0.7cqw); transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .subs.on { opacity: 1; transform: none; }

  .hud {
    position: absolute; left: 1.5cqw; right: 1.5cqw; bottom: calc(1.5cqw + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 1cqw; padding: 0.8cqw 1.4cqw; border-radius: 99px;
    background: var(--hud); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #e6eaee; font: 800 clamp(11px, 1.1cqw, 16px)/1 var(--ui); transition: opacity 0.35s ease;
  }
  .hud.hide { opacity: 0; pointer-events: none; }
  .hud button, .hud label {
    flex: none; display: grid; place-items: center; min-width: 36px; height: 36px; padding: 0 10px;
    border: 0; border-radius: 99px; background: rgba(255, 255, 255, 0.12); color: inherit; font: inherit; cursor: pointer;
  }
  .hud button:hover, .hud label:hover { background: rgba(255, 255, 255, 0.22); }
  .hud button:focus-visible, .hud label:focus-within, .hud input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hud input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .hud .time { flex: none; font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
  .hud input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .hud svg { width: 16px; height: 16px; fill: currentColor; }
  .hud button[aria-pressed="true"] { background: var(--accent); color: #1a0e02; }
  @media (prefers-reduced-motion: reduce) { .title, .chapter, .subs { transition: none; } }
