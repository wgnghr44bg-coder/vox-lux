const sfx = (() => {
  let ctx = null, S = null, enabled = false, lastT = 0;
  return {
    get on() { return enabled; },
    toggle() {
      if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); S = buildSfx(ctx); }
      enabled = !enabled;
      enabled && playing ? ctx.resume() : ctx.suspend();

    },
    pause(p) { if (ctx && enabled) p ? ctx.suspend() : ctx.resume(); },

/* ===================================================================== CHECK: nothing walks through anything */
// window.checkOverlaps() lists moments where insects, cars and people would touch (for testing).
window.checkOverlaps = () => {
  // footprints are rotated rectangles (centre, heading, half length, half width), tested with separating axes
  const out = new Map(), townBugs = INSECTS.filter(I => I.place === 'town' && I.root.parent === dynamic && I.scale > 0.1);
  const dims = I => { const sp = I.sp, xs = sp.legs.map(l => l[3] * sp.foot).concat(sp.parts.map(p => p[1] + p[3]), sp.parts.map(p => p[1] - p[3]));
    return { front: Math.max(...xs) * I.scale, back: -Math.min(...xs) * I.scale, w: Math.max(...sp.legs.map(l => l[4])) * sp.foot * I.scale }; };
  const box = (n, x, z, yaw, f, b, w) => { const c = Math.cos(yaw), s = Math.sin(yaw), ax = [c, -s], az = [s, c], o = (f - b) / 2; return { n, cx: x + ax[0] * o, cz: z + ax[1] * o, ax, az, hl: (f + b) / 2, hw: w }; };
  const sep = (A, B) => { for (const [ux, uz] of [A.ax, A.az, B.ax, B.az]) { const proj = Q => Math.abs(Q.ax[0] * ux + Q.ax[1] * uz) * Q.hl + Math.abs(Q.az[0] * ux + Q.az[1] * uz) * Q.hw;
    if (Math.abs((A.cx - B.cx) * ux + (A.cz - B.cz) * uz) > proj(A) + proj(B)) return true; } return false; };
  const fixed = [...TREES.map(([x, z, r]) => box('tree', x, z, 0, r, r, r)), ...LAMPS.map(([x, z]) => box('lamp', x, z, 0, 0.12, 0.12, 0.12)), ...BUSHES.map(([x, z, s]) => box('bush', x, z, 0, s * 1.1, s * 1.1, s * 1.1))];
  for (let T = 0; T <= DURATION; T += 0.25) {
    if (inPast(T)) continue;
    const ents = [];
    for (const I of townBugs) { const s = I.at(T); if (s.vis === false) continue; const col = clamp(s.collapse ?? 0), d = dims(I), k = 1 + col * 0.35;
      const e = box(`${I.kind}@${Math.round(s.x)},${Math.round(s.z)}`, s.x, s.z, s.yaw ?? 0, d.front * (1 + col * 0.12), d.back * (1 + col * 0.12), d.w * k); ents.push(e);

    }
  }

};

const hud = document.getElementById('hud'), playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const playIcon = document.getElementById('play-icon');
