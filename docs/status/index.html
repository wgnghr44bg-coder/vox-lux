<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png?v=3" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111114">
<!-- 23 nov 2026, eigenaar: "ik wil alleen zien wat er gedaan moet worden, of de pc nu gebruikt wordt, en de planning
     voor Sleep, BlackswanVault en Doodle". De oude uitgebreide pagina staat op uitgebreid.html. Data: data.json. -->
<style>
:root{--bg:#111114;--kaart:#1c1c21;--lijn:#2c2c33;--tekst:#f2f2f5;--zacht:#9a9aa6;--groen:#3ecf6e;--oranje:#ffb547;--rood:#ff5c5c;--blauw:#6aa6ff;
--sleep:#a98bff;--swan:#e8e8ee;--doodle:#ff9f43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;padding:16px 16px 40px}
main{max-width:720px;margin:0 auto}
html,body{overflow-x:hidden}
ul.todo li>div,.titel,.pc>div{min-width:0;overflow-wrap:anywhere}
h1{font-size:22px;margin:4px 0 2px}
.bij{color:var(--zacht);font-size:13px;margin-bottom:18px}
h2{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;padding:14px 16px}
.pc{display:flex;align-items:center;gap:14px}
.stip{width:16px;height:16px;border-radius:50%;flex:none}
.pc b{font-size:18px}
.pc .wat{color:var(--zacht);font-size:14px;margin-top:2px}
ul.todo{list-style:none;margin:0;padding:0}
ul.todo li{padding:10px 0;border-bottom:1px solid var(--lijn);display:flex;gap:10px}
ul.todo li:last-child{border-bottom:0}
.wanneer{color:var(--oranje);font-weight:600;width:96px;flex:none;font-size:14px}
.klein{color:var(--zacht);font-size:13px}
.leeg{color:var(--zacht)}
.dag{margin-top:14px}
.dag:first-child{margin-top:0}
.dagnaam{font-weight:700;font-size:14px;color:var(--zacht);text-transform:capitalize;margin-bottom:4px}
.dagnaam.vandaag{color:var(--blauw)}
.item{display:flex;gap:10px;padding:6px 0;align-items:baseline}
.tijd{color:var(--zacht);font-size:13px;min-width:40px;font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;color:#111}
.l-Sleep{background:var(--sleep)}.l-Swan{background:var(--swan)}.l-Doodle{background:var(--doodle)}
.titel{flex:1;min-width:0}
.stand{font-size:12px;margin-left:4px}
.ok{color:var(--groen)}.nog{color:var(--oranje)}.fout{color:var(--rood)}
.weektabs{display:flex;gap:8px;margin-bottom:10px}
.weektabs button{background:var(--kaart);color:var(--tekst);border:1px solid var(--lijn);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px}
.weektabs button.aan{background:var(--tekst);color:var(--bg)}
a{color:var(--blauw)}
footer{margin-top:30px;font-size:13px;color:var(--zacht)}
</style>
</head>
<body>
<main>
  <h1>Studio</h1>
  <div class="bij" id="bij">laden…</div>

  <h2>Gebruikt de pc nu?</h2>
  <div class="kaart pc" id="pc"><span class="leeg">laden…</span></div>

  <h2>Wat moet er gebeuren</h2>
  <div class="kaart"><ul class="todo" id="todo"><li class="leeg">laden…</li></ul></div>

  <h2>Planning</h2>
  <div class="weektabs" id="tabs"></div>
  <div class="kaart" id="planning"><span class="leeg">laden…</span></div>

  <footer>Alleen Sleep Archives, BlackswanVault en Market Doodle. Tijden in Nederlandse tijd. <a href="uitgebreid.html">Uitgebreide pagina</a></footer>
</main>
<script>
const KAN={"Sleep Archives":"Sleep","BlackswanVault":"Swan","Market Doodle":"Doodle"};
const DAGEN=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vandaag=new Date().toLocaleDateString("sv-SE");
function dagLabel(iso){const d=new Date(iso+"T12:00");const t=DAGEN[d.getDay()]+" "+d.getDate()+" "+d.toLocaleDateString("nl-NL",{month:"short"});return iso===vandaag?"vandaag · "+t:t}
function soortStand(s){s=(s||"").toLowerCase();
  if(/vervalt/.test(s))return null;
  if(/online|gepland|klaar op youtube|staat klaar|gaat vanzelf/.test(s))return["ok","staat klaar"];
  if(/fout|mislukt/.test(s))return["fout",s];
  return["nog",s.split(/[,(:]/)[0]||"nog maken"]}
let D,week=0;
function pc(){
  const n=D.nu_bezig||[], g=D.videokaart, el=document.getElementById("pc");
  const druk=g?g.bezig_procent:null, bezig=n.length>0||(druk!==null&&druk>=40);
  let wat=n.length?n.map(x=>x.naam).join(", "):(bezig?"de videokaart is druk bezig":"er loopt niets zwaars");
  let extra=g?` · videokaart ${druk}%`:"";
  el.innerHTML=`<span class="stip" style="background:${bezig?"var(--oranje)":"var(--groen)"}"></span>
   <div><b>${bezig?"Ja, de pc is bezig":"Nee, de pc is vrij"}</b><div class="wat">${esc(wat)}${extra}</div></div>`;
}
function alleItems(){const u=[];for(const w of D.kanalen?.weken||[])for(const d of w.dagen)for(const x of d.items)if(KAN[x.kanaal])u.push(x);return u}
function todo(){
  const L=[];
  for(const x of alleItems()){const s=soortStand(x.stand);if(!s||s[0]==="ok"||x.datum<vandaag)continue;
    L.push({datum:x.datum,tekst:`<span class="label l-${KAN[x.kanaal]}">${KAN[x.kanaal]}</span> ${esc(x.titel)}`,klein:x.stand})}
  for(const p of D.werkplanning?.publicaties||[]){if(p.kleur==="goed"||p.datum<vandaag)continue;
    if(L.some(l=>l.datum===p.datum&&l.tekst.includes("Sleep")))continue;
    L.push({datum:p.datum,tekst:`<span class="label l-Sleep">Sleep</span> ${esc(p.titel.replace(" | History for Sleep",""))}`,klein:p.stand})}
  for(const f of D.fouten||[])L.push({datum:"",tekst:`<span class="fout">Fout:</span> ${esc(f.tekst)}`,klein:f.tijd});
  if(D.werkplanning&&D.werkplanning.routine_aan===false&&!(D.taken?.bewaker?.aan))L.push({datum:"",tekst:"Sleep Archives staat op pauze",klein:"zeg 'hervatten' om de bewaker weer aan te zetten"});
  L.sort((a,b)=>(a.datum||"0").localeCompare(b.datum||"0"));
  document.getElementById("todo").innerHTML=L.length?L.map(l=>`<li><span class="wanneer">${l.datum?esc(dagLabel(l.datum).replace(/^vandaag · /,"vandaag ").split(" ").slice(0,2).join(" ")):"nu"}</span><div>${l.tekst}<div class="klein">${esc(l.klein||"")}</div></div></li>`).join(""):`<li class="leeg">Niets te doen. Alles staat klaar.</li>`;
}
function planning(){
  const W=D.kanalen?.weken||[];
  document.getElementById("tabs").innerHTML=W.map((w,i)=>`<button class="${i===week?"aan":""}" onclick="week=${i};planning()">${esc(w.label)}</button>`).join("");
  const w=W[week];if(!w){document.getElementById("planning").innerHTML='<span class="leeg">Geen planning gevonden.</span>';return}
  // Sleep-publicaties uit de werkplanning aanvullen als ze ontbreken
  const extra=(D.werkplanning?.publicaties||[]).filter(p=>p.datum>=w.van&&p.datum<=w.tot);
  let html="";
  for(const d of w.dagen){
    let items=d.items.filter(x=>KAN[x.kanaal]&&soortStand(x.stand));
    for(const p of extra)if(p.datum===d.datum&&!items.some(x=>x.kanaal==="Sleep Archives"))items.push({kanaal:"Sleep Archives",tijd:"21:00",titel:p.titel.replace(" | History for Sleep",""),stand:p.stand});
    items.sort((a,b)=>(a.tijd||"").localeCompare(b.tijd||""));
    html+=`<div class="dag"><div class="dagnaam ${d.datum===vandaag?"vandaag":""}">${esc(dagLabel(d.datum))}</div>`+
      (items.length?items.map(x=>{const s=soortStand(x.stand);return `<div class="item"><span class="tijd">${esc(x.tijd||"")}</span><span class="label l-${KAN[x.kanaal]}">${KAN[x.kanaal]}</span><span class="titel">${esc(x.titel.replace(/^Short: /,"Short · "))}<span class="stand ${s[0]}">${s[0]==="ok"?"✓":"● "+esc(s[1])}</span></span></div>`}).join(""):`<div class="item leeg klein">niets gepland</div>`)+`</div>`;
  }
  document.getElementById("planning").innerHTML=html;
}
(async()=>{
  try{D=await (await fetch("data.json?t="+Date.now(),{cache:"no-store"})).json()}
  catch(e){document.getElementById("bij").textContent="Kon de gegevens niet laden.";return}
  document.getElementById("bij").textContent="Bijgewerkt "+(D.bijgewerkt||"?")+" · elk half uur vanaf de pc";
  pc();todo();planning();
})();
</script>
</body>
</html>
