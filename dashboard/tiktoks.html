<title>Sleep Archives TikToks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: één kolom nachtlijst — per Short een kaart met staande video links, datum/bijschrift/knoppen rechts; op de telefoon onder elkaar. */
:root {
  --bg: #0b0d14; --panel: #141826; --line: #262c40; --fg: #e9ecf5; --muted: #9aa3bd;
  --moon: #f3e6c4; --accent: #9fb8ff; --ok: #7fd1a8; --warn: #f2c46d; --yt: #ff7b7b;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f5fa; --panel: #ffffff; --line: #dde1ee; --fg: #151a2b; --muted: #5b6480;
  --moon: #7a5a17; --accent: #3452b8; --ok: #1f7a4f; --warn: #8a5a00; --yt: #b42318; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f4f5fa; --panel: #ffffff; --line: #dde1ee; --fg: #151a2b; --muted: #5b6480;
  --moon: #7a5a17; --accent: #3452b8; --ok: #1f7a4f; --warn: #8a5a00; --yt: #b42318; color-scheme: light }

body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
header h1 { font: 700 clamp(30px, 6vw, 44px)/1.05 var(--display); color: var(--moon); margin: 0; text-wrap: balance; letter-spacing: .01em; }
header p { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--fg); font-weight: 600; }
.tabs { display: flex; gap: 6px; margin: 26px 0 14px; flex-wrap: wrap; }
.tabs button { font: 600 14px var(--body); background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.list { display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; }
.card.yt { border-color: var(--yt); }
.card.done { opacity: .62; }
video { width: 150px; aspect-ratio: 9 / 16; max-width: 100%; border-radius: 10px; background: #000; object-fit: cover; }
.noVideo { width: 150px; aspect-ratio: 9/16; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.meta { min-width: 0; display: grid; gap: 10px; align-content: start; }
.when { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.date { font-weight: 600; color: var(--moon); font-variant-numeric: tabular-nums; }
.tag { font-size: 12px; border-radius: 6px; padding: 1px 8px; border: 1px solid currentColor; }
.tag.today { color: var(--warn); } .tag.done { color: var(--ok); } .tag.soon { color: var(--muted); }
.tag.platform { color: var(--accent); } .tag.platform.yt { color: var(--yt); font-weight: 600; }
.title { font: 700 21px/1.2 var(--display); margin: 0; text-wrap: balance; }
.topic { color: var(--muted); font-size: 13px; }
.label { color: var(--muted); font-size: 12px; margin-bottom: -6px; }
.caption { display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.5 var(--body); -webkit-user-select: text; user-select: text; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button, .actions a { font: 600 14px var(--body); border-radius: 10px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); text-decoration: none; }
.actions .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.card.yt .actions .primary { background: var(--yt); border-color: var(--yt); }
.actions .ok { color: var(--ok); border-color: var(--ok); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 18px; color: var(--muted); text-align: center; }
@media (max-width: 520px) {
  .card { grid-template-columns: 1fr; }
  video, .noVideo { width: min(240px, 100%); justify-self: center; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>Sleep Archives · Shorts</h1>
    <p>Alle Shorts met video en tekst. Kaarten met <b>Voor YouTube</b> (rode rand) upload je zelf op YouTube, de rest gaat naar TikTok. Vink hem daarna af.</p>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="tabs" aria-label="Filter">
    <button id="tab-open" data-f="open" aria-pressed="true">Nog plaatsen</button>
    <button id="tab-done" data-f="done" aria-pressed="false">Geplaatst</button>
    <button id="tab-all" data-f="all" aria-pressed="false">Alles</button>
  </nav>
  <main class="list" id="list">
    <div class="empty">Shorts laden…</div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [], filter = "open", db = null, downloads = null;
try { filter = localStorage.getItem("tt-filter") || "open"; } catch (e) {}

const pad = n => String(n).padStart(2, "0");
const isYT = r => r.platform === "youtube";
function nlToday() {
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Amsterdam" }));
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtDate(s) {
  if (!s) return "geen datum";
  const [d, t] = s.split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const dag = new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  return t ? `${dag} · ${t}` : dag;
}
function srcOf(r) { return r.video_url || (r.video_id ? "/_blob/" + r.video_id : ""); }

function render() {
  const today = nlToday();
  const open = rows.filter(r => !r.geplaatst), done = rows.filter(r => r.geplaatst);
  const dueToday = open.filter(r => (r.datum || "").slice(0, 10) <= today).length;
  $("#stats").innerHTML = "";
  [["Nog plaatsen", open.length], ["Vandaag of eerder", dueToday], ["Voor YouTube", open.filter(isYT).length], ["Geplaatst", done.length]].forEach(([k, v]) => {
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = `<b></b> ${k}`; c.querySelector("b").textContent = v; $("#stats").append(c);
  });
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));
  const list = $("#list"); list.innerHTML = "";
  let shown = filter === "open" ? open : filter === "done" ? done.slice().reverse() : rows;
  if (!db) { list.innerHTML = '<div class="empty">Deze pagina kan de lijst nu niet laden. Open hem ingelogd op claude.ai.</div>'; return; }
  if (!shown.length) {
    list.innerHTML = `<div class="empty">${filter === "done" ? "Nog niets afgevinkt." : "Geen Shorts om te plaatsen. Nieuwe Shorts verschijnen hier vanzelf zodra een video-sessie klaar is."}</div>`;
    return;
  }
  for (const r of shown) list.append(card(r, today));
}

// Kopiëren: eerst de oude manier (werkt ook in de app op de iPhone), dan de nieuwe,
// en anders de tekst selecteren zodat je zelf op Kopiëren kunt tikken.
function copyText(text, field, status, what) {
  const copied = () => { status.textContent = `${what} gekopieerd.`; };
  const manual = () => { field.focus(); field.select(); status.textContent = "Tik op de tekst, kies Alles selecteren en dan Kopiëren."; };
  let ok = false;
  try {
    field.readOnly = false; field.focus({ preventScroll: true }); field.select(); field.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
  } catch (e) {}
  field.readOnly = true; field.blur();
  if (ok) { copied(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    Promise.race([navigator.clipboard.writeText(text), new Promise((_, no) => setTimeout(no, 1500))]).then(copied, manual);
  } else manual();
}

function textBox(meta, label, text) {
  if (label) { const l = document.createElement("div"); l.className = "label"; l.textContent = label; meta.append(l); }
  const t = document.createElement("textarea");
  t.className = "caption"; t.readOnly = true; t.setAttribute("inputmode", "none"); t.setAttribute("aria-label", label || "Bijschrift");
  t.value = text;
  requestAnimationFrame(() => { t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; });
  t.onfocus = () => t.select();
  meta.append(t);
  return t;
}

function card(r, today) {
  const yt = isYT(r);
  const el = document.createElement("article"); el.className = "card" + (yt ? " yt" : "") + (r.geplaatst ? " done" : "");
  const src = srcOf(r);
  const media = src ? Object.assign(document.createElement("video"), { src, controls: true, preload: "metadata", playsInline: true }) : Object.assign(document.createElement("div"), { className: "noVideo", textContent: "Video volgt" });
  const meta = document.createElement("div"); meta.className = "meta";
  const day = (r.datum || "").slice(0, 10);
  const tag = r.geplaatst ? ["done", "Geplaatst"] : day < today ? ["today", "Te laat"] : day === today ? ["today", "Vandaag"] : ["soon", "Gepland"];
  meta.innerHTML = `
    <div class="when"><span class="tag platform"></span><span class="date"></span><span class="tag state"></span></div>
    <div><h2 class="title"></h2><div class="topic"></div></div>`;
  const pl = meta.querySelector(".platform");
  pl.textContent = yt ? "Voor YouTube" : "TikTok";
  if (yt) pl.classList.add("yt");
  meta.querySelector(".date").textContent = fmtDate(r.datum);
  const st = meta.querySelector(".state"); st.textContent = tag[1]; st.classList.add(tag[0]);
  meta.querySelector(".title").textContent = r.titel || "Short";
  meta.querySelector(".topic").textContent = r.onderwerp || "";

  const acts = document.createElement("div"); acts.className = "actions";
  const status = document.createElement("div"); status.className = "status"; status.setAttribute("role", "status");

  if (yt) {
    const t1 = textBox(meta, "Titel", r.titel || "");
    const t2 = textBox(meta, "Beschrijving", r.beschrijving || r.bijschrift || "");
    const c1 = btn("Titel kopiëren", "primary"); c1.onclick = () => copyText(t1.value, t1, status, "Titel");
    const c2 = btn("Beschrijving kopiëren"); c2.onclick = () => copyText(t2.value, t2, status, "Beschrijving");
    acts.append(c1, c2);
  } else {
    const cap = textBox(meta, "", r.bijschrift || "");
    const copy = btn("Bijschrift kopiëren", "primary");
    copy.onclick = () => copyText(cap.value, cap, status, "Bijschrift");
    acts.append(copy);
    if (navigator.share) {
      const share = btn("Delen");
      share.onclick = async () => {
        try { await navigator.share({ text: cap.value }); status.textContent = "Kies Kopieer of TikTok in het deelmenu."; }
        catch (e) { if (!e || e.name !== "AbortError") { cap.focus(); cap.select(); } }
      };
      acts.append(share);
    }
  }

  if (src) {
    const dl = btn("Video downloaden");
    dl.onclick = async () => {
      if (!downloads) { status.textContent = "Downloaden lukt hier niet. Houd de video ingedrukt en kies Bewaar."; return; }
      status.textContent = "Video ophalen…";
      try {
        const blob = await (await fetch(src)).blob();
        await downloads.save({ filename: (r.bestand || (r.id || "short") + ".mp4"), data: blob });
        status.textContent = "Video opgeslagen.";
      } catch (e) {
        status.textContent = e && e.code === "declined" ? "Downloaden geannuleerd." : "Downloaden lukte niet. Houd de video ingedrukt en kies Bewaar.";
      }
    };
    acts.append(dl);
  }
  if (r.youtube) {
    const a = document.createElement("a"); a.href = r.youtube; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Lange video";
    acts.append(a);
  }
  const mark = btn(r.geplaatst ? "Terugzetten" : yt ? "Geplaatst op YouTube" : "Geplaatst op TikTok", r.geplaatst ? "" : "ok");
  mark.onclick = async () => {
    mark.disabled = true;
    try { await db.collection("tiktoks").doc(r.id).update({ geplaatst: !r.geplaatst }); }
    catch (e) { status.textContent = "Opslaan lukte niet. Probeer het opnieuw."; mark.disabled = false; }
  };
  acts.append(mark);
  meta.append(acts, status);
  el.append(media, meta);
  return el;
}
function btn(t, cls) { const b = document.createElement("button"); b.type = "button"; b.textContent = t; if (cls) b.className = cls; return b; }

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; try { localStorage.setItem("tt-filter", filter); } catch (e) {} render();
});

(async () => {
  const c = window.claude;
  if (!c || !c.use) { render(); return; }
  [db, downloads] = await Promise.all([c.use("db"), c.use("downloads")]);
  if (!db) { render(); return; }
  db.collection("tiktoks").orderBy("datum").onSnapshot(
    snap => { rows = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    () => { $("#list").innerHTML = '<div class="empty">De lijst kon niet laden. Ververs de pagina.</div>'; }
  );
})();
</script>
