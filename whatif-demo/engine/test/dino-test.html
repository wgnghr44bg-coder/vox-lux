<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}</style></head>
<body><script type="importmap">{ "imports": { "three": "../../node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
const W = 1280, H = 720;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fbcc9); scene.fog = new THREE.Fog(0xc4d2d2, 140, 1000);
const cam = new THREE.PerspectiveCamera(42, W / H, .5, 3000); cam.position.set(-6, 3.2, 19); cam.lookAt(1.5, 5, -3);
scene.add(new THREE.HemisphereLight(0xe8eef0, 0x6a5a40, 1.4));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.6); sun.position.set(-60, 80, 40); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 300 }); sun.shadow.bias = -.0005; scene.add(sun);
let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lam = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const sh = m => { m.castShadow = m.receiveShadow = true; return m; };
const mesh = (g, c, p = [0, 0, 0], s = [1, 1, 1], rot = [0, 0, 0]) => { const m = sh(new THREE.Mesh(g, lam(c))); m.position.set(...p); m.scale.set(...s); m.rotation.set(...rot); return m; };

// ground: rolling, with a muddy river
{ const g = new THREE.PlaneGeometry(1600, 1600, 120, 120); g.rotateX(-Math.PI / 2); const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, Math.sin(x * .02) * 1.5 + Math.cos(z * .025) * 1.2 + (R() - .5) * .5 + Math.max(0, -z - 200) * .05); }
  g.computeVertexNormals(); const m = sh(new THREE.Mesh(g, lam(0x7d8a4a))); scene.add(m); }
{ const w = new THREE.Mesh(new THREE.PlaneGeometry(1600, 30), lam(0x5f7a72)); w.rotation.x = -Math.PI / 2; w.rotation.z = .25; w.position.set(0, .3, -70); scene.add(w); }
// volcano with smoke
{ const v = mesh(new THREE.ConeGeometry(220, 260, 9, 1, true), 0x5b524a, [260, 120, -700]); scene.add(v);
  const c = mesh(new THREE.ConeGeometry(70, 60, 9), 0x3a3330, [260, 230, -700]); scene.add(c);
  for (let i = 0; i < 14; i++) { const s = mesh(new THREE.IcosahedronGeometry(30 + i * 5, 0), 0x8e8a86, [260 + i * 14 + (R() - .5) * 20, 270 + i * 26, -700 + (R() - .5) * 30]); s.material.transparent = true; s.material.opacity = .75 - i * .04; s.castShadow = false; scene.add(s); } }
// plants: tree ferns, cycads, ferns
function treeFern(x, z, h) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  g.add(mesh(new THREE.CylinderGeometry(.25, .4, h, 6), 0x5a4632, [0, h / 2, 0]));
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; const f = mesh(new THREE.ConeGeometry(.6, 4.5, 4), [0x4f6e2e, 0x5d7a34, 0x466428][i % 3], [Math.sin(a) * 1.8, h - .3, Math.cos(a) * 1.8], [1, 1, .25]);
    f.rotation.set(Math.cos(a) * 1.15, 0, -Math.sin(a) * 1.15); f.rotation.order = 'YXZ'; f.rotation.y = a; f.rotation.x = 1.15; g.add(f); } }
function fern(x, z, s) { for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + R(); const f = mesh(new THREE.ConeGeometry(.35 * s, 2 * s, 4), 0x56772f, [x + Math.sin(a) * .7 * s, .5 * s, z + Math.cos(a) * .7 * s], [1, 1, .3]);
  f.rotation.order = 'YXZ'; f.rotation.y = a; f.rotation.x = 1; scene.add(f); } }
for (let i = 0; i < 70; i++) { const x = (R() - .5) * 260, z = -20 - R() * 200; treeFern(x, z, 5 + R() * 7); }
for (let i = 0; i < 25; i++) { const x = -40 + R() * 25, z = 10 - R() * 50; if (Math.abs(x) > 8) treeFern(x, z, 5 + R() * 6); }
for (let i = 0; i < 120; i++) fern((R() - .5) * 120, 30 - R() * 90, .8 + R() * .8);
for (let i = 0; i < 40; i++) scene.add(mesh(new THREE.DodecahedronGeometry(.4 + R() * 1.2, 0), 0x7b766c, [(R() - .5) * 100, .2, 20 - R() * 80]));

// T-REX (low-poly, ~12 m long, hip height ~3.3 m), mid-stride, roaring
function trex(col = 0x6f6a3e, belly = 0xb7a874) {
  const g = new THREE.Group();
  const body = mesh(new THREE.IcosahedronGeometry(1, 1), col, [0, 4.1, 0], [1.5, 1.55, 3.1], [.12, 0, 0]); g.add(body);
  const bel = mesh(new THREE.IcosahedronGeometry(1, 1), belly, [0, 3.45, .5], [1.2, 1.0, 2.4], [.15, 0, 0]); g.add(bel);
  // tail: tapered segments going back (-z) and slightly down
  let tz = -2.6, ty = 4.4, rr = 1.05;
  for (let i = 0; i < 10; i++) { const L = .85; const seg = mesh(new THREE.CylinderGeometry(rr * .84, rr, L * 1.45, 7), col, [Math.sin(i * .5) * .25 * i * .3, ty, tz - L / 2], [1, 1, 1], [Math.PI / 2 + .12, 0, 0]); g.add(seg);
    tz -= L * 1.05; ty -= .07 - i * .012; rr *= .84; }
  g.add(mesh(new THREE.ConeGeometry(rr, 2, 6), col, [.5, ty - .1, tz - .6], [1, 1, 1], [-Math.PI / 2 - .1, 0, 0]));
  // neck + head (head up, jaw open)
  g.add(mesh(new THREE.CylinderGeometry(.75, 1.05, 1.8, 7), col, [0, 5.2, 2.6], [1, 1, 1], [.75, 0, 0]));
  const head = new THREE.Group(); head.position.set(0, 6.0, 3.4); head.rotation.x = -.25; g.add(head);
  head.add(mesh(new THREE.BoxGeometry(1.25, 1.05, 2.3), col, [0, .2, .8]));
  head.add(mesh(new THREE.BoxGeometry(1.0, .55, 1.0), col, [0, .25, 2.3]));
  head.add(mesh(new THREE.BoxGeometry(.9, .2, .5), col, [0, .72, .9]));                       // brow ridge
  const jaw = new THREE.Group(); jaw.position.set(0, -.25, .1); jaw.rotation.x = .45; head.add(jaw);
  jaw.add(mesh(new THREE.BoxGeometry(1.0, .38, 2.6), belly, [0, -.15, 1.25]));
  head.add(mesh(new THREE.BoxGeometry(.95, .08, 1.7), 0x5a2e2a, [0, -.28, 1.4]));            // mouth inside
  for (const s of [-1, 1]) { for (let k = 0; k < 6; k++) { head.add(mesh(new THREE.ConeGeometry(.06, .22, 3), 0xefe8d6, [s * .44, -.38, .6 + k * .32], [1, 1, 1], [Math.PI, 0, 0])); jaw.add(mesh(new THREE.ConeGeometry(.05, .18, 3), 0xefe8d6, [s * .38, .1, .4 + k * .33])); }
    head.add(mesh(new THREE.IcosahedronGeometry(.11, 0), 0x1c1a14, [s * .6, .45, 1.15])); }
  // tiny arms
  for (const s of [-1, 1]) { const a = mesh(new THREE.CylinderGeometry(.13, .18, 1.0, 5), col, [s * 1.05, 3.9, 2.4], [1, 1, 1], [-.9, 0, s * .2]); g.add(a);
    g.add(mesh(new THREE.ConeGeometry(.1, .35, 4), 0xd8d0b8, [s * 1.1, 3.55, 2.85], [1, 1, 1], [-1.6, 0, 0])); }
  // legs: big thigh, shin, foot with 3 toes; stride pose
  for (const [s, ph] of [[-1, .5], [1, -.45]]) {
    const hip = new THREE.Group(); hip.position.set(s * 1.15, 3.9, -.2); hip.rotation.x = ph; g.add(hip);
    hip.add(mesh(new THREE.IcosahedronGeometry(1, 1), col, [0, -.9, .1], [.75, 1.45, 1.1]));
    const knee = new THREE.Group(); knee.position.set(0, -2.2, .35); knee.rotation.x = -ph * 1.1 - .35; hip.add(knee);
    knee.add(mesh(new THREE.CylinderGeometry(.32, .48, 2.2, 6), col, [0, -1.0, 0]));
    const ankle = new THREE.Group(); ankle.position.set(0, -2.1, 0); ankle.rotation.x = ph * .5 + .7; knee.add(ankle);
    ankle.add(mesh(new THREE.CylinderGeometry(.2, .3, 1.3, 5), col, [0, -.6, 0]));
    const foot = new THREE.Group(); foot.position.set(0, -1.25, 0); foot.rotation.x = -ankle.rotation.x - knee.rotation.x - hip.rotation.x - .1; ankle.add(foot);
    for (const t of [-.28, 0, .28]) foot.add(mesh(new THREE.BoxGeometry(.2, .2, 1.0), col, [t, -.05, .45], [1, 1, 1], [0, t * .5, 0]));
  }
  // dark stripes on the back
  for (let i = 0; i < 6; i++) g.add(mesh(new THREE.BoxGeometry(2.0, .12, .35), 0x4c4a2a, [0, 5.55 - Math.abs(i - 2) * .08, 1.6 - i * .9], [1, 1, 1], [.1, 0, 0]));
  return g;
}
const t = trex(); t.position.set(2, 1.3, -2); t.rotation.y = 1.25; scene.add(t);

// sauropods in the distance (long necks), a small herd by the river
function sauropod(x, z, s, ry) { const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = ry; scene.add(g);
  const c = 0x7a7466; g.add(mesh(new THREE.IcosahedronGeometry(1, 1), c, [0, 4.2, 0], [2.2, 1.9, 3.6]));
  for (const [lx, lz] of [[-1.2, 2], [1.2, 2], [-1.2, -2], [1.2, -2]]) g.add(mesh(new THREE.CylinderGeometry(.55, .65, 3.6, 6), c, [lx, 1.8, lz]));
  for (let i = 0; i < 8; i++) g.add(mesh(new THREE.CylinderGeometry(.5 - i * .03, .6 - i * .03, 1.6, 6), c, [0, 5 + i * 1.15, 3.2 + i * .7], [1, 1, 1], [.55, 0, 0]));
  g.add(mesh(new THREE.BoxGeometry(.7, .55, 1.3), c, [0, 14.3, 9.2]));
  for (let i = 0; i < 9; i++) g.add(mesh(new THREE.CylinderGeometry(.6 - i * .065, .7 - i * .065, 1.5, 6), c, [0, 4 - i * .25, -3.6 - i * 1.3], [1, 1, 1], [Math.PI / 2 - .15, 0, 0])); }
sauropod(70, -120, 1.1, 1.9); sauropod(95, -140, .95, 2.1); sauropod(48, -150, 1.0, 1.7); sauropod(120, -170, .8, 2.3);
// pterosaurs in the sky
for (const [x, y, z] of [[-10, 38, -60], [6, 44, -90], [-30, 50, -120]]) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = .6; scene.add(g);
  for (const s of [-1, 1]) { const w = new THREE.Mesh(new THREE.ConeGeometry(.9, 4.5, 3), lam(0x4e463c)); w.rotation.z = s * Math.PI / 2; w.position.x = s * 2.2; w.scale.z = .15; g.add(w); }
  g.add(new THREE.Mesh(new THREE.ConeGeometry(.3, 2.2, 4), lam(0x4e463c))).rotation.x = Math.PI / 2; }
r.render(scene, cam); window.done = true;
</script></body></html>
