}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
$('title').innerHTML = TL.title; $('endT').innerHTML = TL.end.title; $('endS').innerHTML = TL.end.lines;
$('lab').textContent = TL.hud.label;

  $('sub').textContent = (9.8 * gv).toFixed(1) + ' m/s²';
  $('wgt').textContent = `${TL.hud.second}  ${Math.round(TL.hud.weight * gv)} lb`;

// ---------- frame ----------
const C = hex => new THREE.Color(hex);
const SKY = [[0, C(0x6f9fd0), C(0xd6e2ea)], [D + 1, C(0x6f9fd0), C(0xd6e2ea)], [26, C(0x7b9cbd), C(0xd0d4d0)], [46, C(0x8a99a4), C(0xc6c3b8)],

const keyCol = (t, j) => { let i = 0; while (i < SKY.length - 2 && t > SKY[i + 1][0]) i++;
  const [a, b] = [SKY[i], SKY[i + 1]]; return a[j].clone().lerp(b[j], smooth(a[0], b[0], t)); };

  else if (shot === 2) { haze = .5 + smooth(47, 56, t) * .2; scene.fog.near = lerp(160, 30, haze); scene.fog.far = lerp(1400, 380, haze); }
  else { haze = .3 + smooth(64, 71, t) * .45 - smooth(B.settle, B.end, t) * .1; scene.fog.near = lerp(260, 20, haze); scene.fog.far = lerp(2200, 900, haze); }
  pMat.uniforms.fogColor.value.copy(scene.fog.color); pMat.uniforms.fogNear.value = scene.fog.near; pMat.uniforms.fogFar.value = scene.fog.far;
  hemi.intensity = lerp(1.5, .85, haze); sun.intensity = lerp(2.4, .5, smooth(.2, .9, haze));
  hemi.color.copy(C(0xe3ecf4).lerp(C(0xbcac93), haze));

  const state = t > r0 - 1 && t < r0 ? 1 : t >= r0 && t < r1 ? 0 : 2;
  tlights.forEach(l => l.bulbs.forEach((b, i) => b.material.color.setHex(state === i ? [0xc4392f, 0xd99a2b, 0x4fae6a][i] : 0x222222)));

  poseProps(t);
  const f = t * FPS, i0 = Math.min(NF - 2, Math.floor(f)), fr = f - i0;
  // people
  for (const p of people) {
    const A = p.arr, o = i0 * 8, q = o + 8, L = k => lerp(A[o + k], A[q + k], fr);
    let rot = A[o + 2]; if (Math.abs(A[q + 2] - rot) < 1) rot = L(2);
    const sit = L(5), lean = L(6), hunch = L(7), amp = L(4);
    p.g.position.set(L(0), .2 - sit * .42, L(1)); p.g.rotation.y = rot;
    p.pose.rotation.x = hunch - lean * .2 - sit * .1; p.pose.position.z = -lean * .12;
    const sw = Math.sin(L(3)) * .45 * amp * (1 - sit);

  // cyclist

    bike.g.position.set(-8.9, .2, z);

    bike.rider.rotation.x = smooth(D, D + 1, t) * .15;

    c.mesh.g.position.set(c.x, .75, wrapJump ? c.arr[i0] : z); c.mesh.g.visible = !(shot === 2 && z > -10); c.mesh.g.rotation.y = c.dir > 0 ? 0 : Math.PI;

    const sp = spring(t, 11, 2.6);

    const flap = Math.sin(t * (t > D ? 22 : 9) + bd.ph) * (t > D ? .8 : .5);

  if (shot === 1) { plane.position.set(-700 + 70 * t, 1100 - (t > D ? 18 * (t - D) + 8 * smooth(D, D + 2, t) : 0), -2400); plane.rotation.set(0, 0, -.06 * smooth(D, D + 2, t)); }
  else if (shot === 3) { const s = smooth(B.plane[0], B.plane[1], t); plane.position.set(560 - 34 * (t - 57.3), 430 - 200 * s, -1500); plane.rotation.set(0, Math.PI, .16 * Math.sin(s * Math.PI)); }
  plane.visible = shot !== 2;

  // bodies
  for (const b of bodies) {
    const A = b.arr, o0 = i0 * 7, o1 = o0 + 7, st = A[o0 + 6];
    const px = lerp(A[o0], A[o1], fr), py = lerp(A[o0 + 1], A[o1 + 1], fr), pz = lerp(A[o0 + 2], A[o1 + 2], fr);
    const rx = lerp(A[o0 + 3], A[o1 + 3], fr), ry = lerp(A[o0 + 4], A[o1 + 4], fr), rz = lerp(A[o0 + 5], A[o1 + 5], fr);
    const visible = st === 1 || (st === 0 && !b.hidden);
    if (b.kind === 'part') { b.src.visible = st === 0; b.obj.visible = st === 1; if (st === 1) { b.obj.position.set(px, py, pz); b.obj.rotation.set(rx, ry, rz); } continue; }
    const s = b.inst.scale, sv = b.inst.sv;
    DUMMY.position.set(px, py, pz); DUMMY.rotation.set(rx, ry, rz);
    if (!visible) DUMMY.scale.set(0, 0, 0); else if (sv) DUMMY.scale.set(sv[0], sv[1], sv[2]); else DUMMY.scale.setScalar(s);
    DUMMY.updateMatrix(); b.inst.im.setMatrixAt(b.inst.i, DUMMY.matrix);
  }
  for (const k in IM) { IM[k].instanceMatrix.needsUpdate = true; if (IM[k].instanceColor) IM[k].instanceColor.needsUpdate = true; }
  for (const b of floorsNear) { if (b === site) continue;
    const cracked = inShot2(b.cz) && t > crackT(b);
    for (const m of b.floors) m.material = facadeMats(b.color, cracked ? 'cracked' : 'win'); }

  // crane: the mast buckles, the top folds over
  { const th = hinge(t, crane.t0, 2.3, 1.8), pre = smooth(crane.t0 - 1, crane.t0, t) * .02 + sag * .004;
    crane.top.rotation.z = crane.s * (th + pre); crane.g.rotation.z = crane.s * (pre * .5 + th * .03); }
  // towers: floor onto floor, straight down
  for (const tw of collapsing) {
    const c = crushed(tw, t), front = Math.max(tw.pile, tw.yF - c);
    tw.slices.forEach((m, i) => {
      const y0 = i * FH;
      if (y0 + FH <= tw.yF + .01) { m.visible = y0 + FH <= front + .01; m.position.y = y0 + FH / 2; }
      else { const yb = y0 - c; m.visible = yb >= front - .01; m.position.y = yb + FH / 2; }
    });
    const topY = tw.h - c; tw.crown.position.set(tw.x, topY + 3.5, tw.z); tw.crown.visible = topY > front + 1;
    const ms = smooth(tGround(tw) - .5, tDone(tw) + .8, t); tw.mound.visible = ms > .01; tw.mound.scale.set(.6 + .4 * ms, ms, .6 + .4 * ms); tw.mound.position.y = 7.5 * ms;

  { const Dg = bridgeSag(t), pts = [];
    for (let i = 0; i <= BR.N; i++) { const u = i / BR.N, x = -BR.half + u * 2 * BR.half; pts.push([x, BR.Y - Dg * Math.sin(Math.PI * u), BR.Y + BR.rise * Math.sin(Math.PI * u) - Dg * 1.1 * Math.sin(Math.PI * u)]); }
    for (let i = 0; i < BR.N; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], m = brDeck[i];
      m.position.set((x0 + x1) / 2, (y0 + y1) / 2, BR.z); m.rotation.z = Math.atan2(y1 - y0, x1 - x0); m.scale.x = Math.hypot(x1 - x0, y1 - y0) + .4; }
    for (const zz of [-8, 8]) for (let i = 0; i < BR.N; i++) {
      const [x0, y0, a0] = pts[i], [x1, y1, a1] = pts[i + 1], z = BR.z + zz;
      beam(steelIM, [x0, a0, z], [x1, a1, z], 1.6);
      beam(steelIM, [x0, y0 + 1, z], [x0, a0, z], .8);
      beam(steelIM, [x0, y0 + 1, z], [x1, a1, z], .6);
    }
  }

    const N = 16, sagD = w.d0 * (1 + 1.1 * spring(t, 6, 2) + .3 * creep(t));
    const P0 = [-WALK, w.y, w.z], P1 = [WALK, w.y, w.z];

      for (const s of [-1, 1]) { let prev = [s * WALK, w.y, w.z];
        for (let k = 1; k <= 8; k++) { const d = k / 8 * Lh, cur = [s * WALK - s * Math.cos(phi) * d, Math.max(.25, w.y + Math.sin(phi) * d), w.z]; beam(cableIM, prev, cur, .07); prev = cur; } }

  else if (shot === 2) { const push = smooth(46.4, 57.3, t) * 5; pos = [-1, 3.0, 8 - push]; look = [-1, 23, -200]; setShadow(0, -80, 90, 130); }

  const cp = camera.position;
  plist.sort((a, b) => ((b[0] - cp.x) ** 2 + (b[1] - cp.y) ** 2 + (b[2] - cp.z) ** 2) - ((a[0] - cp.x) ** 2 + (a[1] - cp.y) ** 2 + (a[2] - cp.z) ** 2));

  for (let i = 0; i < n; i++) { const p = plist[plist.length - n + i];
    P.pos.set([p[0], p[1], p[2]], i * 3); P.size[i] = p[3]; P.alpha[i] = p[4]; P.col.set([p[5], p[6], p[7]], i * 3); P.rot[i] = p[8]; }
