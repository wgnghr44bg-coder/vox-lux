// ---------- particles: dust from the hole, water from the pipe ----------

// ---------- HUD ----------
const $ = id => document.getElementById(id);

// ---------- camera: one continuous move, from street level up over the hole ----------
const KEYS = [
  [0, [0, 4.2, 96], [0, 7, -60]],
  [B.pipe, [0, 4.2, 80], [0, 2, -20]],
  [B.dip, [0, 5, 60], [0, .5, -6]],
  [B.cracks + 1, [0, 8, 48], [0, 0, -3]],
  [B.police + 1, [1, 13, 50], [0, -1, -4]],
  [B.drop, [2, 20, 54], [0, -8, -4]],
  [B.drop + 3, [2, 44, 32], [0, -6, -4]],
  [B.guat, [3, 58, 28], [0, -12, -3]],
  [B.grow, [3, 86, 50], [0, -10, -4]],
  [B.china, [0, 126, 86], [0, -10, -4]],
  [B.q, [-6, 154, 104], [0, -10, -4]],
  [TL.T_END, [-9, 162, 110], [0, -10, -4]],

// smooth the path a little more (a short box filter in time): no kinks at the keys
function camAt(t) { const out = [[0, 0, 0], [0, 0, 0]], n = 9;
  for (let k = 0; k < n; k++) { const p = camPath(clamp(t + (k - 4) * .25, 0, TL.T_END)); for (let j = 0; j < 2; j++) for (let c = 0; c < 3; c++) out[j][c] += p[j][c] / n; }
  return out; }

// ---------- events (sound design + checks) ----------
const EVENTS = [{ t: B.pipe, kind: 'water', e: .4 }, { t: B.dip, kind: 'creak', e: .4 }, { t: B.cracks, kind: 'crack', e: .6 },
  { t: B.cracks + 1.2, kind: 'crack', e: .5 }, { t: B.police, kind: 'siren', e: .5 }, { t: B.drop, kind: 'collapse', e: 1 }];
for (const f of fallers) if (f.tf < TL.T_END) EVENTS.push({ t: f.tf, kind: f.big ? 'building' : 'fall', e: f.big ? 1 : .4, x: f.x, z: f.z });
for (let t = B.grow; t < B.grow + 8; t += .9) EVENTS.push({ t, kind: 'slide', e: clamp(dRt(t) / 6) });
EVENTS.sort((a, b) => a.t - b.t);
// safety check: no person and no moving car is ever near the edge
{ let worst = 1e9;
  for (let f = 0; f < TL.T_END * FPS; f += 3) { const t = f / FPS;
    for (const p of people) { const q = personAt(p, t); worst = Math.min(worst, Math.hypot(q[0] - CX, q[1] - CZ) - edgeAt(q[0], q[1], t)); }
    for (const c of cars) { const s = carAt(c, t), x = c.a === 'z' ? c.c : s, z = c.a === 'z' ? s : c.c; if (t > B.drop - 1) worst = Math.min(worst, Math.hypot(x - CX, z - CZ) - edgeAt(x, z, t)); } }

function personAt(p, t) {

// ---------- frame ----------
const C = hex => new THREE.Color(hex);
const TCOL = new THREE.Color(1, 1, 1), DUMMY = new THREE.Object3D(), AX = new THREE.Vector3(), Q = new THREE.Quaternion();
function fallPose(f, t) {

  g.position.set(f.home[0] - ux * Math.min(4, a * 1.6), -drop, f.home[1] - uz * Math.min(4, a * 1.6));

}
window.renderAt = function (t) {
  const depth = depthAt(t), R0 = Rt(t), dip = clamp(depth / .15) * .15;
  const dust = smooth(B.drop, B.drop + 4, t) * (1 - .5 * smooth(B.guat, B.grow, t)) + smooth(B.grow, B.grow + 4, t) * .7 * (1 - smooth(B.china, B.q + 2, t) * .6);
  const sk = [C(0x6f9fd0), C(0xd6e2ea)], dk = [C(0x8f9aa2), C(0xcbc4b4)];
  skyMat.uniforms.top.value.copy(sk[0]).lerp(dk[0], dust * .7); skyMat.uniforms.hor.value.copy(sk[1]).lerp(dk[1], dust * .8);
  scene.fog.color.copy(skyMat.uniforms.hor.value); scene.fog.near = lerp(220, 120, dust); scene.fog.far = lerp(1700, 1100, dust);
  pMat.uniforms.fogColor.value.copy(scene.fog.color); pMat.uniforms.fogNear.value = scene.fog.near; pMat.uniforms.fogFar.value = scene.fog.far;
  { const v = new THREE.Vector2(); renderer.getDrawingBufferSize(v); pMat.uniforms.scale.value = v.y / (2 * Math.tan(THREE.MathUtils.degToRad(30))); }
  hemi.intensity = lerp(1.5, 1.2, dust); sun.intensity = lerp(2.4, 1.6, dust);
  $('haze').style.opacity = dust * .06;

  // tiles: the dip, then the fall
  for (let k = 0; k < tiles.length; k++) {
    const T = tiles[k]; let y = 0, rx = 0, rz = 0, x = T.x, z = T.z, s = 1;
    if (T.d < 11) y -= dip * (1 - (T.d / 11) ** 2);
    const a = t - T.tf;
    if (a > 0) {
      const ux = (T.x - CX) / (T.d || 1), uz = (T.z - CZ) / (T.d || 1), fall = .5 * 9.8 * a * a;
      if (fall > Math.min(depth + 2, 30)) {                       // on the floor: part of the pile
        const r = R0 * .55 * Math.sqrt(T.pile[0]), an = T.pile[1] * 6.28; x = CX + Math.cos(an) * r; z = CZ + Math.sin(an) * r; y = -depth + .4; rx = T.ph * 2; rz = T.pile[0] * 2; s = .9;
      } else { y = -fall; x -= ux * Math.min(3, a * 2); z -= uz * Math.min(3, a * 2); rx = uz * Math.min(1.4, a * 1.9) * (T.ph > .5 ? 1 : -.6); rz = -ux * Math.min(1.4, a * 1.9); }
    }
    DUMMY.position.set(x, y, z); DUMMY.rotation.set(rx, 0, rz); DUMMY.scale.setScalar(s); DUMMY.updateMatrix(); tileIM.setMatrixAt(k, DUMMY.matrix);
    TCOL.setScalar(a > 0 ? (y < -20 ? .08 : lerp(1, .35, clamp(-y / 20))) : 1); tileIM.setColorAt(k, TCOL);
  }
  tileIM.instanceMatrix.needsUpdate = true; tileIM.instanceColor.needsUpdate = true;
  // hole walls and floor
  wall.visible = R0 > .05; floorG.visible = R0 > .05;
  wall.scale.set(R0 + 1.2, depth, R0 + 1.2); wall.position.set(CX, -.45, CZ);
  floorG.scale.set((R0 + 1.2) * 1.08, 1, (R0 + 1.2) * 1.08); floorG.position.set(CX, -depth - .3, CZ);
  rubble.visible = depth > 20;
  // puddle and cracks
  { const g = smooth(B.pipe, B.cracks, t); puddle.scale.setScalar(.3 + g * 4.2); puddle.visible = t > B.pipe && R0 < 1; puddle.position.y = .02 - dip * .9; }
  for (const c of cracks) { const g = smooth(c.t0, c.t0 + .35, t); c.m.visible = g > 0 && t < c.tf; c.m.scale.x = 1.35 * g;
    const d = Math.hypot(c.x - CX, c.z - CZ); c.m.position.y = .03 - (d < 11 ? dip * (1 - (d / 11) ** 2) : 0); }
  // props
  for (const f of fallers) fallPose(f, t);
  // traffic lights: green for the avenue, then all red at the dip; dead once they lean
  tlights.forEach((l, i) => { const st = t > B.cracks + 1.5 ? -1 : t > B.dip ? 0 : (i < 2 ? (t % 14 < 7 ? 2 : 0) : (t % 14 < 7 ? 0 : 2));
    l.bulbs.forEach((b, j) => b.material.color.setHex(st === j ? [0xc4392f, 0xd99a2b, 0x4fae6a][j] : 0x222222)); });
  // people
  for (const p of people) { const [x, z, rot, ph, amp] = personAt(p, t); p.g.position.set(x, 0, z); p.g.rotation.y = rot;
    const sw = Math.sin(ph) * .5 * amp; p.legs[0].rotation.x = sw; p.legs[1].rotation.x = -sw; }
  // cars
  for (const c of cars) { const s = carAt(c, t); c.m.g.position.set(c.a === 'z' ? c.c : s, 0, c.a === 'z' ? s : c.c);
    c.m.g.rotation.y = c.a === 'z' ? (c.dir > 0 ? Math.PI : 0) : (c.dir > 0 ? -Math.PI / 2 : Math.PI / 2);
    c.m.g.visible = Math.abs(s) < 700; c.m.brake.material.color.setHex(t > B.dip && !c.out ? 0xc8352b : 0x5a2420); }
  for (const p of police) p.bar.forEach((m, i) => m.material.color.setHex(t > B.police && Math.floor(t * 3 + i) % 2 ? m.userData.on : 0x333333));
  for (const b of barriers) { const u = smooth(b.t0, b.t0 + .5, t); b.leg.scale.y = Math.max(.001, u); b.leg.visible = u > 0; }

  // camera
  const [pos, look] = camAt(t);
  let shake = 0; for (const ev of EVENTS) { if (ev.t > t || t - ev.t > 3) continue; const a = t - ev.t;
    shake += ({ collapse: .5, building: .25, crack: .05, creak: .03 }[ev.kind] || 0) * Math.exp(-a * 2.5); }
  shake = Math.min(shake, .45);
  const sx = Math.sin(t * 37.1) * .6 + Math.sin(t * 23.3) * .4, sy = Math.sin(t * 31.7) * .6 + Math.sin(t * 19.9) * .4;
  camera.position.set(pos[0] + sx * shake * .25, pos[1] + sy * shake * .25, pos[2]);
  camera.lookAt(look[0] + sx * shake * 1.2, look[1] + sy * shake * 1.2, look[2]);
  { const tx = Math.round(look[0] * .5 + pos[0] * .5), tz = Math.round(lerp(pos[2], look[2], .6)), half = clamp(pos[1] * 1.6 + 60, 70, 260);
    sun.target.position.set(tx, 0, tz); sun.position.set(tx - 90, 160, tz + 110);
    Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, near: 10, far: 800 }); sun.shadow.camera.updateProjectionMatrix(); }

  plist.length = 0; if (!location.search.includes('nodust')) particles(t);
  const cp = camera.position;
  plist.sort((a, b) => ((b[0] - cp.x) ** 2 + (b[1] - cp.y) ** 2 + (b[2] - cp.z) ** 2) - ((a[0] - cp.x) ** 2 + (a[1] - cp.y) ** 2 + (a[2] - cp.z) ** 2));
  const n = Math.min(plist.length, MAXP);
  for (let i = 0; i < n; i++) { const p = plist[plist.length - n + i];
    P.pos.set([p[0], p[1], p[2]], i * 3); P.size[i] = p[3]; P.alpha[i] = p[4]; P.col.set([p[5], p[6], p[7]], i * 3); P.rot[i] = p[8]; }
  pGeo.setDrawRange(0, n);
  for (const k of ['position', 'color', 'size', 'alpha', 'rot']) pGeo.attributes[k].needsUpdate = true;
  hud(t);
  renderer.render(scene, camera);
  return n;
};
window.DBG = { wall, floorG, tileIM, camera }; window.T_END = TL.T_END; window.TL = TL; window.EVENTS = EVENTS; window.LINES = LINES;
document.fonts.ready.then(() => { window.ready = true; });
</script>
