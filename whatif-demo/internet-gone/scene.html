  const blockers = new Set();
  const addB = (li, zt, t, skew, xTo) => { const c = pick(li, zt); c.stopT = t; c.skewTo = skew; c.xTo = xTo; blockers.add(c); };
  addB(2, 24, B.jam - .3, .5, .9); addB(3, 20, B.jam + .4, -.42, .7); addB(1, -150, B.jam - 1, .35, -.6); addB(0, -120, B.jam + .8, -.3, -.5);
  simulate(blockers);
  // police car: the toward-camera car that ends up around z -70 in the jam
  const atC = c => at(c, B.siren);
  const pol = cars.filter(c => c.lane === 2).sort((a, b) => Math.abs(atC(a) + 70) - Math.abs(atC(b) + 70))[0]; pol.police = true;
  for (const c of cars) { c.mesh = carMesh(scene, c.col, { police: c.police, taxi: c.taxi && !c.police }); c.lightT = B.dusk - 1 + hash(cars.indexOf(c), 7) * 2.5; }
  // horns: more and more once the traffic locks up
  const HR = rng(91);
  for (let t = B.nav + 1.5; t < QUIET - .3; t += .25 + 2.2 * (1 - smooth(B.nav, B.climax + 2, t)) * HR()) {
    const c = cars[Math.floor(HR() * cars.length)], z = at(c, t);
    if (z > CAMZ - 4 || z < -260) continue;
    EVENTS.push({ t, kind: 'horn', x: c.x, z, len: .25 + HR() * (t > B.climax ? 1.4 : .7), pitch: HR() });
  }
}

// ---------- people ----------
const people = [];
{ const R = rng(31);
  // pavement walkers (both sides). Everyone has a phone; some already look at it while walking
  for (let i = 0; i < 46; i++) {
    const s = i < 26 ? 1 : -1, p = makePerson(scene, R, { phone: true });
    Object.assign(p, { type: 'walk', x: s > 0 ? 10.8 + R() * 3.8 : -(10.8 + R() * 4.4), z0: CAMZ - 6 - R() * 190, dir: R() < .5 ? -1 : 1, v: 1.15 + R() * .4,
      stopT: B.stopWalk + R() * 1.4, phoneT: B.phones + R() * .9, eachT: B.eachOther + R() * 1.2, phoneEarly: R() < .4, ph: R() * 6, look: (R() < .5 ? -1 : 1) * (.6 + R() * .7) });
    people.push(p);
  }
  // queue at the cash machine
  for (let k = 0; k < 9; k++) { const p = makePerson(scene, R, { phone: true });
    Object.assign(p, { type: 'queue', slot: k, x: 15.25 - (k ? .1 + R() * .25 : 0), zs: atm.z - .9 - k * .95, t0: B.queue + k * .45 + R() * .3, v: 1.4, ph: R() * 6, look: (R() - .5) * 2 });
    people.push(p); }
  // climax: offices empty out, people fill the pavements and walk between the stuck cars
  const strips = [0, 5, -5, 9.1, -9.1];
  for (let i = 0; i < 95; i++) { const p = makePerson(scene, R, { phone: true });
    const road = i < 50, x = road ? strips[i % strips.length] + (R() - .5) * .5 : (i % 2 ? 1 : -1) * (11 + R() * 4);
    Object.assign(p, { type: 'crowd', x, z0: 30 - R() * 95, dir: R() < .55 ? 1 : -1, v: 1.5 + R() * .7,
      t0: B.evening + 2 + R() * (B.climax + 2 - B.evening), ph: R() * 6, wave: R() < .25, look: (R() < .5 ? -1 : 1) });
    people.push(p);
  }
}
const ease = (t, ts, tau = .6) => t < ts ? t : ts + tau * (1 - Math.exp(-(t - ts) / tau));     // decelerate to a stop
function personAt(p, t) {
  if (t >= QUIET) { p.g.visible = false; return; }
  let x = p.x, z, rot, walk = 0, stride = 0, headDown = 0, headYaw = 0, phoneUp = 0, wave = 0;
  if (p.type === 'walk') {
    const span = 200, a = CAMZ - 4 - span, wrap = v => a + ((v - a) % span + span) % span;
    const te = ease(t, p.stopT);
    z = wrap(p.z0 + p.dir * p.v * te); rot = p.dir > 0 ? 0 : Math.PI;
    walk = te * p.v * 4.2 + p.ph; stride = .45 * (1 - smooth(p.stopT, p.stopT + .8, t));
    phoneUp = Math.max(p.phoneEarly ? .55 : 0, smooth(p.phoneT, p.phoneT + .5, t)) * (1 - smooth(p.eachT, p.eachT + .6, t) * .55);
    headDown = phoneUp * .55;
    headYaw = smooth(p.eachT, p.eachT + .7, t) * p.look * (1 + .3 * Math.sin(t * .7 + p.ph));
    rot += smooth(p.eachT + .5, p.eachT + 2, t) * p.look * .5;
    p.g.visible = true;
  } else if (p.type === 'queue') {
    const arrived = t >= p.t0;                                         // walks up the pavement toward the camera to its place in the line
    z = Math.min(p.zs, p.zs - (p.t0 - t) * p.v); rot = 0;
    walk = t * p.v * 4.2 + p.ph; stride = arrived ? 0 : .45;
    p.g.visible = true;
    phoneUp = arrived ? .5 * (1 - smooth(B.atm, B.atm + 1, t)) : 0; headDown = phoneUp * .5;
    headYaw = smooth(B.atm + .3 + p.slot * .15, B.atm + 1.2 + p.slot * .15, t) * p.look;
    if (p.slot === 0 && arrived) rot = Math.PI / 2 + smooth(B.atm + .6, B.atm + 1.6, t) * 2.4;
  } else {
    const tt = t - p.t0; p.g.visible = tt > 0;
    z = p.z0 + p.dir * p.v * Math.max(0, tt); rot = p.dir > 0 ? 0 : Math.PI;
    walk = tt * p.v * 4.4 + p.ph; stride = .55;
    headYaw = Math.sin(t * 1.3 + p.ph) * .6; phoneUp = p.wave ? 0 : .6 + .3 * Math.sin(t * .4 + p.ph); headDown = phoneUp * .3;
    wave = p.wave ? smooth(p.t0 + 1, p.t0 + 2, t) * (.6 + .4 * Math.sin(t * 2 + p.ph)) : 0;
    if (z > CAMZ - 3 || z < -200) p.g.visible = false;
  }
  if (p.type === 'walk' && z > CAMZ - 4.5 && Math.abs(x - CAMX) < 2.5) p.g.visible = false;
  posePerson(p, { x, z, rot, walk, stride, headDown, headYaw, phoneUp, wave, t });
}

// ---------- planes ----------
const flights = [];
{ const R = rng(61);
  for (const t0 of [-24, -16, -8, 0, 7, 14, 22, 30, 39, 50]) {
    const s = R() < .5 ? -1 : 1, y = 300 + R() * 160, zz = -700 - R() * 600;
    flights.push({ P: plane(scene, 70), a: new THREE.Vector3(-s * 1100, y, zz + (R() - .5) * 300), b: new THREE.Vector3(s * 1100, y + (R() - .5) * 80, zz + (R() - .5) * 300), t0, dur: 34 + R() * 10 });
  }
}

// ---------- paper in the empty street ----------
const papers = [];
for (let i = 0; i < 7; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.32, .42), new THREE.MeshLambertMaterial({ color: 0xe6e1d6, side: THREE.DoubleSide }));
  m.castShadow = true; scene.add(m); papers.push({ m, x: (hash(i, 1) - .5) * 18, z: -5 - hash(i, 2) * 50, v: .8 + hash(i, 3) * 1.2, ph: hash(i, 4) * 6 }); }

// ---------- audio events that depend only on the timeline ----------
{ const R = rng(77);
  for (let t = 1.5; t < 41; t += .5 + R() * (t < 30 ? 1.6 : 3.5)) EVENTS.push({ t, kind: 'ping', x: (R() - .5) * 2, pitch: R() });      // phones buzzing, fewer after the glitch
  screens.forEach(s => EVENTS.push({ t: s.offT, kind: 'screen', x: clamp(s.x / 20, -1, 1), z: s.z }));
  EVENTS.push({ t: ticker.offT, kind: 'screen', x: -.6, z: -60 }, { t: B.atm, kind: 'atm', x: .7 }, { t: B.glitch, kind: 'glitch', x: 0 });
  shops.forEach(s => EVENTS.push({ t: s.t0, kind: 'shutter', x: .8, z: s.cz }));
  EVENTS.push({ t: B.siren, kind: 'siren', x: -.2 }, { t: QUIET, kind: 'quiet', x: 0 });
  EVENTS.sort((a, b) => a.t - b.t);
}

// ---------- frame ----------
const SKY = keyframes([[0, C(0x7aa3cc), C(0xd3dde2)], [40, C(0x7f9fc0), C(0xd0d6d6)], [54, C(0x8a93ad), C(0xd8c6aa)], [60, C(0x5d6386), C(0xd99a6c)],
                       [65, C(0x2c3352), C(0x8a6458)], [70, C(0x16203e), C(0x3a3f5c)], [90, C(0x131b36), C(0x323752)]]);
const hud = makeHud(TL);
const fmt1 = v => v.toFixed(1);
window.renderAt = function (t) {
  const quiet = t >= QUIET;
  skyMat.uniforms.top.value.copy(SKY(t, 1)); skyMat.uniforms.hor.value.copy(SKY(t, 2));
  scene.fog.color.copy(skyMat.uniforms.hor.value);
  const night = smooth(56, 70, t);
  sun.intensity = lerp(2.4, 0, smooth(52, 66, t)); sun.color.copy(C(0xffeedd).lerp(C(0xff9a5a), smooth(52, 62, t)));
  sun.position.set(-90, lerp(110, 40, smooth(40, 66, t)), 120);
  hemi.intensity = lerp(1.5, 1.05, night); hemi.color.copy(C(0xe3ecf4).lerp(C(0x8796c8), night)); hemi.groundColor.copy(C(0x5a5448).lerp(C(0x2a2a33), night));
  scene.fog.near = lerp(150, 60, night); scene.fog.far = lerp(1100, 700, night);

  // screens, ticker, windows, shops, cash machine, lamps
  for (const s of screens) s.m.material = screenState(s, t);
  ticker.m.material = t < ticker.offT ? ticker.on : screenOff; ticker.tex.offset.x = (Math.min(t, ticker.offT) * .03) % 1;
  for (const tw of towers) {
    const day = .25 * (1 - smooth(tw.offT, tw.offT + .4, t)) * (t > B.glitch && t < B.glitch + .8 && Math.floor(t * 9 + tw.ph * 5) % 3 === 0 ? .3 : 1);
    tw.mat.emissiveIntensity = Math.max(day, tw.nightLit ? smooth(60, 66, t) * .85 : .02 + (1 - smooth(tw.offT, tw.offT + .4, t)) * night * .6);
  }
  for (const s of shops) { const k = smooth(s.t0, s.t0 + 2.2, t); s.shut.scale.y = Math.max(.001, k); s.open.visible = t < s.t0 - .3;
    s.win.material.emissiveIntensity = .55 * (1 - smooth(s.t0 + 1.5, s.t0 + 3, t)); }
  atm.scr.material = t < B.atm ? atm.onMat : (t < B.atm + .5 && Math.floor(t * 14) % 2) ? atm.onMat : atm.offMat;
  atm.halo.material.color.setHex(t < B.atm ? 0x6aa8ff : 0xff4a3a);
  for (const l of lamps) l.L.setOn(smooth(l.t0, l.t0 + .25, t));

  // cars
  const f = Math.min(NF - 1, Math.round(t * FPS));
  for (const c of cars) {
    const o = f * 4, z = c.arr[o], v = c.arr[o + 3];
    c.mesh.g.visible = !quiet && z < CAMZ - 1.5;
    c.mesh.g.position.set(c.x + c.arr[o + 2], .75, z); c.mesh.g.rotation.set(0, (c.dir > 0 ? Math.PI : 0) + c.arr[o + 1], 0);
    setCarLights(c.mesh, smooth(c.lightT, c.lightT + .2, t), t > B.nav - 3 && v < 6, c.police && t > B.siren ? (t * 2.2) % 1 : -1);
  }
  for (const p of people) personAt(p, t);
  for (const fl of flights) { const u = (t - fl.t0) / fl.dur; fl.P.fly(fl.a, fl.b, u, 700, 1 - night * .8); }
  for (const p of papers) { const a = Math.max(0, t - QUIET); p.m.visible = quiet;
    p.m.position.set(p.x + a * p.v * .6 + Math.sin(a * 1.3 + p.ph) * .6, .26 + Math.max(0, Math.sin(a * 2.1 + p.ph)) * .5, p.z + a * p.v);
    p.m.rotation.set(-Math.PI / 2 + Math.sin(a * 3 + p.ph) * .6, a * .8 + p.ph, Math.sin(a * 2.4 + p.ph) * .4); }

  // camera: eye height on the right pavement, slow push in, gentle hand-held sway; still in the quiet
  const push = quiet ? 4 + smooth(QUIET, T_END, t) * 3 : smooth(0, QUIET, t) * 9;
  const sway = quiet ? .3 : 1 + smooth(B.climax - 2, B.climax + 1, t) * 1.2;
  const sx = noise(t * .35, 1) * .05 * sway, sy = noise(t * .3, 2) * .035 * sway;
  camera.position.set(CAMX + sx, 2.3 + sy, CAMZ - push);
  camera.lookAt(-3 + sx * 20, 24 + sy * 30, -200);

  const pct = counterAt(t);
  const black = smooth(QUIET - .9, QUIET - .1, t) - smooth(QUIET + .3, QUIET + 1.3, t) * .82 + smooth(B.end - 1, B.end + 1, t) * .3;
  hud(t, { num: Math.round(pct) + TL.hud.unit, second: `${TL.hud.second}  ${fmt1(TL.usersMax * pct / 100)} billion`,
           secondOpacity: smooth(9.6, 10.8, t) * .85, hudOpacity: smooth(.4, 1.4, t) * (1 - smooth(QUIET - .9, QUIET - .2, t)) + smooth(QUIET + 1, QUIET + 2.2, t) * (1 - smooth(B.end - .8, B.end, t)) * .8,
           black, haze: 0 });
  renderer.render(scene, camera);
  return 0;
};
window.T_END = T_END; window.TL = TL; window.EVENTS = EVENTS;
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
